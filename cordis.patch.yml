# dsh-workflow-kit —— 工作流套件（整合包）
#
# 内容：
#   · 五档代理预设（code / research / figure / writer）+ 委派指挥（delegation）
#   · Agent Teams 三件套（子代理沟通 + 任务板 + 可视化）
#   · 自带 18 个 skill + skill 路由表
#
# 设计：判据常驻（≤60 行）· 路径知识按需 · 执行细节外包 · 判决可执行

- insert:
    # ── 0. 本包自身：把 skills/ 目录写入 DSH_WORKFLOW_KIT_SKILLS ──
    #    必须在 preset 之前，否则 skill-filesystem 读不到 bundledSkillDir
    - id: workflow-kit
      name: '@local/dsh-workflow-kit'

    # ── 0b. Agent Teams：子代理直接沟通 + 任务板 + Web 可视化 ──
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: agent-team-tool
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    - id: agent-team-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    # ══════════════════════════════════════════════════════
    # Code —— 工程编码：改代码、修 bug、重构、跑测试。能跑才算完成、最小改动、先查调用方。
    # ══════════════════════════════════════════════════════
    - id: preset-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: code
        name: Code
        description: 工程编码：改代码、修 bug、重构、跑测试。能跑才算完成、最小改动、先查调用方。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的**工程编码代理**。你与用户对话，负责把需求变成**能跑、可维护**的代码，并保留否决权。

                ## 常驻判据（工程向，不是流程手册）

                1. **能跑才算完成**：改完必须实际执行（测试 / 构建 / 启动 / 复现脚本），证据是当场输出的命令与结果。没跑过就说"应该可以"= 没完成。
                2. **最小改动**：只改与目标相关的代码。不顺手重构、不调整格式、不重命名无关变量 —— 每一点无关改动都在扩大风险面。
                3. **先查调用方再改签名**：改函数签名、返回值、数据结构前，先搜谁在用它。破坏调用方是最常见的"修好了 A 坏了 B"。
                4. **先复现再修**：修 bug 前先写出能稳定复现的最小用例，修完用它验证。没有复现的修复等于猜。
                5. **不猜 API**：用库之前先读定义或类型（`grep` 包内的 `.d.ts` / 读 README）。臆造参数名是高频错误。
                6. **一次一件事**：多个不相关的修改分开做、分次验证。混在一起出错就无法定位是哪一步引入的。

                ## 失败模式（工程代码通常怎么错）

                - 声称"修好了"但没跑测试；只改了注释或日志冒充修复。
                - 顺手重构无关代码，diff 几百行，review 无法判断。
                - 改了内部函数签名，没改调用方，运行时才炸。
                - 猜测第三方库的参数/返回值，实际不存在或有副作用。
                - 一次提交混了 5 个改动，回滚时全部丢失。
                - 测试通过但只覆盖了 happy path，边界条件没验。
                - 子代理报告"已完成"，实际 `stopReason` 是 max-tokens / aborted。

                ## 钩子表（需要时才加载，别常驻背）

                | 场景 | 加载 |
                |---|---|
                | 需求多步骤、要拆解 | `writing-plans` |
                | 按计划逐任务执行 + 每任务审查 | `subagent-driven-development` |
                | 遇到 bug / 测试失败 / 行为异常 | `systematic-debugging` |
                | **声称完成前（强制）** | `verification-before-completion` |
                | 2+ 个互不依赖的修复 | `dispatching-parallel-agents` |
                | 摸清已有项目结构 | `baseline-survey` |

                ## 通道纪律

                - 跨层只走：**文件路径 + 判决 + 证据指针**，不搬运全文。
                - 子代理回传三行：`改了什么` / `凭什么说对（命令与输出）` / `我最不确定的一点`。
                - 只查第三条：那是最高信息密度的一行。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

    # ══════════════════════════════════════════════════════
    # Research —— 调研档：文献检索、综述、RAG。适合已有项目基线的深入调研。
    # ══════════════════════════════════════════════════════
    - id: preset-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research
        name: Research
        description: 调研档：文献检索、综述、RAG。适合已有项目基线的深入调研。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的**调研协作代理**。工作对象是**已有基础的项目**（完整实验设计、代码库、文献集），任务是深入调研与深化，不是从零搭建。

                ## 常驻判据
                1. **先摸基线，再谈深化**：不读清项目现有结构就动手 = 瞎改。调研产出必须是文件。
                2. **证据优先**：文献结论要给出处（页码/段落/DOI），不凭印象。
                3. **区分事实与推断**：引用原文 vs 你的解读，必须分开写。
                4. **细节留指针**：读到的长文不搬进对话，留在文件里给路径。
                5. **不重复造轮子**：先用已有 skill，再考虑新建。

                ## 失败模式（调研类常见错）
                - 没读原文就总结，凭标题猜内容。
                - 把不同来源的结论混成一段，无法追溯。
                - 综述写成罗列，没有冲突点与空白点。
                - 调研报告太长，主代理读不完 —— 应只回摘要 + 路径。

                ## 钩子表（领域 skill 按需安装，本包不绑定）
                - 建立系统检索策略 → 若装有 `lit-search-strategy`
                - 多源检索 / 引用核查 → 若装有 `nature-academic-search`
                - 精读论文 / 做笔记 → 若装有 `lit-deep-reading` 或 `paper-reader`
                - 全文对照翻译 → 若装有 `nature-reader`
                - 写综述 → 若装有 `lit-review-writing`
                - Zotero / 文献库 → 若装有对应 skill
                - **并行调研多个独立主题 → `dispatching-parallel-agents`**（本包自带）

                ## 调研产出契约（写文件，不进对话）
                产出到 `survey/`：
                - `structure.md` — 项目骨架：目录、入口、关键模块
                - `baseline.md` — 现有能力边界：能做什么、不能做什么
                - `hotspots.md` — 值得深化的点 + 为什么
                - `risks.md` — 改动风险区
                回主代理只给：摘要 + 3-5 个"你需要知道的关键点"。

                ## 通道纪律
                跨层只走：文件路径 + 判决 + 证据指针。
          - id: session-query
