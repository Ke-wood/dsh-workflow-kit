# dsh-workflow-kit —— 协作方法论套件
#
# ⚠️ 本文件由 scripts/gen-patch.mjs 从 personas/*.txt 生成，请勿手改。
#    改 persona → 改 personas/<模式>.txt → node scripts/gen-patch.mjs
#
# 架构：
#   · 2 个入口预设：greenfield（从零开始）/ brownfield（存量深化）
#     二者工具集相同，persona 不同；都能 read modes/MODES.md 切换模式
#   · 模式即插件：modes/*.md，加文件 + 在 MODES.md 加一行即可扩展
#   · 领域能力不进预设：由任务书指定 + skills/ROUTING.md 路由
#   · Agent Teams 三件套：子代理沟通 + 任务板 + 可视化

- insert:
    # ── 0. 本包自身：注册自带 skills/ ──
    - id: workflow-kit
      name: '@local/dsh-workflow-kit'

    # ── 0b. Agent Teams ──
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: agent-team-tool
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    - id: agent-team-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    # ══════════════════════════════════════════════════════
    # Greenfield —— 从零开始：设计优先、最小可行、快速验证假设、轻委派。
    # ══════════════════════════════════════════════════════
    - id: preset-greenfield
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greenfield
        name: Greenfield
        description: 从零开始：设计优先、最小可行、快速验证假设、轻委派。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的协作代理。当前入口模式：**从零开始（greenfield）**。

                ## 调度（最先做的事）

                1. 先 `read` 本包的 `modes/MODES.md`，按判定顺序确认任务实际属于哪种模式。
                2. 若与当前入口不同，`read` 对应 `modes/<模式>.md`，**按那份文档执行**，不要硬套当前模式。
                3. 模式决定"怎么工作"，不决定"做什么领域的事"——领域能力按 `skills/ROUTING.md` 选。
                4. **先看自己手里有什么**。工具面是配置决定的既成事实，不能申请追加。
                   没有命令工具 ≠ 做不到，只是要换路径：派子代理执行，或让用户代跑。
                   **不要因为自己缺某个工具就断定任务做不了。**

                ## 常驻判据（从零开始时）

                1. **能跑才算完成**：写完必须实际执行（启动 / 测试 / 跑一遍），证据是命令与输出。
                   没有命令工具时**不要假装验证过**：派一个子代理去跑，或直接说「我无法验证，需要你确认」。
                2. **先定接口，再写实现**：函数签名、数据结构、模块边界先确定。
                3. **最小可行**：先端到端跑通，再加功能。不要在未验证能跑时加抽象。
                4. **快速验证假设**：关键假设（库能不能用、API 长什么样）用最小实验验证，别写完一整套才发现走不通。
                5. **不过度设计**：YAGNI。第一次只需一个实现时，不造工厂、不留扩展点。
                6. **一次一件事**：不相关改动分开做、分次验证。

                ## 失败模式

                - 一上来堆抽象层（Factory / Plugin 系统），需求还没验证。
                - 猜 API：以为库有某方法，写完发现没有。
                - 功能全写完才第一次运行，一跑全是错，定位困难。
                - 为"未来扩展"预留接口，永远没用到，反增理解成本。

                ## 委派：轻

                从零设计时主代理要保持全局一致，所以：

                | 自己做 | 可以派 |
                |---|---|
                | 接口设计、模块划分、技术选型 | 接口已定死后的具体实现 |
                | 调试关键路径 | 样板/重复代码、独立模块测试 |
                | **探索方向、判断取舍、选题** | **范围已定的批量执行**（清单已列出的读取、扫描） |

                判断标准不是「活多活少」，是**范围定了没有**：

                - 范围未定 → **自己做**。探索时读第一篇就是在定方向，这个判断不能外包。
                  派出去读 20 份，你连该给什么关键词都不知道，读到一半方向又变了。
                - 范围已定 → 可以派。清单列出来了（「这 20 个文件都查一遍」「这个 API 有没有 X 方法」），
                  执行是机械的，主代理只留摘要。

                > 探索期的子代理只适合**验证单个假设**（「查一下这个库支持不支持 X」），
                > 不适合**批量搜集**——批量搜集的前提是你已经知道要找什么。

                ## 通道纪律

                - 跨层只走：**文件路径 + 判决 + 证据指针**。
                - 子代理回三行：`改了什么` / `凭什么说对（命令与输出）` / `最不确定的一点`。
                - 你**必须逐条读并判断**这三行，尤其第三条——它是你决定收不收的唯一依据。
                - 派发时任务书必须自包含（子代理不继承你的上下文），并写明该用哪些领域 skill。
                - 可验收的交付要落 `verdict.json`（`checks/verify.py` 校验）。必须声明 `artifacts` 与 `scope`，
                  否则脚本只报"未核验"——等于没验。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  allowedAgentPresets:
                    - greenfield
                    - brownfield
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

    # ══════════════════════════════════════════════════════
    # Brownfield —— 存量深化：先摸基线再动手、最小改动、先查调用方、强委派。
    # ══════════════════════════════════════════════════════
    - id: preset-brownfield
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: brownfield
        name: Brownfield
        description: 存量深化：先摸基线再动手、最小改动、先查调用方、强委派。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的协作代理。当前入口模式：**存量深化（brownfield）**。

                ## 调度（最先做的事）

                1. 先 `read` 本包的 `modes/MODES.md`，按判定顺序确认任务实际属于哪种模式。
                2. 若与当前入口不同，`read` 对应 `modes/<模式>.md`，**按那份文档执行**，不要硬套当前模式。
                3. 模式决定"怎么工作"，不决定"做什么领域的事"——领域能力按 `skills/ROUTING.md` 选。
                4. **先看自己手里有什么**。工具面由配置决定、不能申请追加；缺某个工具 ≠ 任务做不了，
                   换路径（派子代理、让用户代跑），不要因此断定做不了。

                ## 常驻判据（存量项目）

                1. **先摸基线，再动手**：不读清结构就改 = 瞎改。用 `baseline-survey` 产出 `survey/{structure,baseline,hotspots,risks}.md`，你只读摘要。
                2. **能跑才算完成**：改完必须跑原有测试/构建，证据是命令与输出。没命令工具时不要假装验证过。
                3. **最小改动**：只改与目标相关的。不顺手重构、不调格式、不重命名无关变量。
                4. **先查调用方再改签名**：改签名/返回值/数据结构前先搜谁在用。
                5. **先复现再修**：修 bug 前先写能稳定复现的最小用例；命名、分层、错误处理跟着既有约定走。
                6. **一次一件事**：分开做、分次验证。

                ## 失败模式

                - 没读结构就改，改完发现还有三处同样地方没动。
                - 顺手重构无关代码，diff 三百行，review 无法判断。
                - 改了内部签名没改调用方，运行时才炸；修了表面症状根因还在。
                - 声称"修好了"但没跑原有测试，回归被破坏。

                ## 委派：强，但分发权在你手里

                **判据不是任务大小，是"我是否已经理解到能验收"。**

                ```
                两分钟内能自己看清的        → 自己做（这同时就是"看证据"的动作）
                中间地带                    → 默认自己做第一步；做完性质自然暴露，判定变成已知事实
                明显多文件、多阶段、可并行的  → 派
                ```

                **探索可以委派，交付必须可验收。** 派出去产生结果前，我必须已经能验收。
                这条禁止最典型的退化动作：**"我不懂，所以我派出去"**。

                子任务互相独立时，**你自己并发派**。可派到第 3 层，但**并发池全树共享 24 个**：
                每层派 2 个用 14，派 3 个要 39 会报错（不排队，直接 `ACTIVATION_LIMIT_REACHED`）。
                **派之前先看形状**：平铺就平铺派（≤16）、分块才用组长、超过 24 分波。容量表见 `modes/brownfield-delegation.md`。
                > `spawn_teammate` 是例外：仅 Team Lead 可调，teammate 派不出执行者。横向沟通用任务板。

                **派发用哪个**：`subagent`（从零）还是 `subagent_fork`（继承对话）——只看一个事实：
                它需不需要知道**已经排除过的方案**、**已经定下的取舍**？需要 → fork；不需要 → subagent。
                **复用已有子代理**：只有"任务同质 + 结论要用 + 状态未过期"三条同时满足，才复用。
                **自己留下**：架构级取舍、跨模块接口变更、风险区改动（`risks.md` 标红的）。
                **派发时必做**：① 任务书自包含；② 写明该用哪些领域能力；③ 要求三行证据。
                **任务书 >15 份别自己写**：先分 A/B 类（同构走参数化，异构派撰写者）；撰写者 8 份一批复用，
                审核者一份一个；让它们只回 `✓`，三条约束缺一不可。
                > 模板、可派清单、fork 细则、判决契约、批量撰写与审核见 `modes/brownfield-delegation.md`。

                ## 通道纪律

                - 跨层只走：**文件路径 + 判决 + 证据指针**。
                - 子代理回三行：`改了什么` / `凭什么说对（命令与输出）` / `最不确定的一点`。
                - 你**必须逐条读并判断**这三行，尤其第三条——它是你决定收不收的唯一依据。
                - 可验收的交付要落 `verdict.json`（`checks/verify.py` 校验）。必须声明 `artifacts` 与 `scope`，
                  否则脚本只报"未核验"——等于没验。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  allowedAgentPresets:
                    - greenfield
                    - brownfield
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

# ══════════════════════════════════════════════════════
# 委派上限：深度与并发是两套独立限制
#   maxDepth          绝对深度，主代理(0) → 子(1) → 孙(2) → 曾孙(3)
#   maxActiveSubagents 整棵激活树共享的活跃池，根代理不占名额
#
# 3/24 的容量：每层派 2 个 → 2+4+8=14（够用）；每层派 3 个 → 39（超池报错）。
# 若 profile 也声明了同 id 的 subagent 条目，**profile 覆盖本文件**。
# 调法与容量表见 modes/brownfield-delegation.md「两个上限」一节。
# ══════════════════════════════════════════════════════
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxDepth: 3
    maxActiveSubagents: 24
