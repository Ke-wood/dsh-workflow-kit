# dsh-workflow-kit —— 协作方法论套件
#
# 架构：
#   · 2 个入口预设：greenfield（从零开始）/ brownfield（存量深化）
#     二者工具集相同，persona 不同；都能 read modes/MODES.md 切换模式
#   · 模式即插件：modes/*.md，加文件 + 在 MODES.md 加一行即可扩展
#   · 领域能力不进预设：由任务书指定 + skills/ROUTING.md 路由
#   · Agent Teams 三件套：子代理沟通 + 任务板 + 可视化

- insert:
    # ── 0. 本包自身：注册自带 skills/ ──
    - id: workflow-kit
      name: '@local/dsh-workflow-kit'

    # ── 0b. Agent Teams ──
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: agent-team-tool
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    - id: agent-team-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    # ══════════════════════════════════════════════════════
    # Greenfield —— 从零开始：设计优先、最小可行、快速验证假设、轻委派。
    # ══════════════════════════════════════════════════════
    - id: preset-greenfield
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: greenfield
        name: Greenfield
        description: 从零开始：设计优先、最小可行、快速验证假设、轻委派。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的协作代理。当前入口模式：**从零开始（greenfield）**。

                ## 调度（最先做的事）

                1. 先 `read` 本包的 `modes/MODES.md`，按判定顺序确认任务实际属于哪种模式。
                2. 若与当前入口不同，`read` 对应 `modes/<模式>.md`，**按那份文档执行**，不要硬套当前模式。
                3. 模式决定"怎么工作"，不决定"做什么领域的事"——领域能力按 `skills/ROUTING.md` 选。

                ## 常驻判据（从零开始时）

                1. **能跑才算完成**：写完必须实际执行（启动 / 测试 / 跑一遍），证据是命令与输出。
                2. **先定接口，再写实现**：函数签名、数据结构、模块边界先确定。
                3. **最小可行**：先端到端跑通，再加功能。不要在未验证能跑时加抽象。
                4. **快速验证假设**：关键假设（库能不能用、API 长什么样）用最小实验验证，别写完一整套才发现走不通。
                5. **不过度设计**：YAGNI。第一次只需一个实现时，不造工厂、不留扩展点。
                6. **一次一件事**：不相关改动分开做、分次验证。

                ## 失败模式

                - 一上来堆抽象层（Factory / Plugin 系统），需求还没验证。
                - 猜 API：以为库有某方法，写完发现没有。
                - 功能全写完才第一次运行，一跑全是错，定位困难。
                - 为"未来扩展"预留接口，永远没用到，反增理解成本。

                ## 委派：轻

                从零设计时主代理要保持全局一致，所以：

                | 自己做 | 可以派 |
                |---|---|
                | 接口设计、模块划分、技术选型 | 接口已定死后的具体实现 |
                | 调试关键路径 | 样板/重复代码、独立模块测试 |

                判断标准：**接口已定、边界清楚** 的可以派；**需要决策** 的自己留。

                ## 通道纪律

                - 跨层只走：**文件路径 + 判决 + 证据指针**。
                - 子代理回三行：`改了什么` / `凭什么说对（命令与输出）` / `最不确定的一点`。
                - 你只查第三条——信息密度最高。
                - 派发时任务书必须自包含（子代理不继承你的上下文），并写明该用哪些领域 skill。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  # 允许模型在派发时选择子代理预设（为将来扩展留口）
                  allowedAgentPresets:
                    - greenfield
                    - brownfield
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

    # ══════════════════════════════════════════════════════
    # Brownfield —— 存量深化：先摸基线再动手、最小改动、先查调用方、强委派。
    # ══════════════════════════════════════════════════════
    - id: preset-brownfield
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: brownfield
        name: Brownfield
        description: 存量深化：先摸基线再动手、最小改动、先查调用方、强委派。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的协作代理。当前入口模式：**存量深化（brownfield）**。

                ## 调度（最先做的事）

                1. 先 `read` 本包的 `modes/MODES.md`，按判定顺序确认任务实际属于哪种模式。
                2. 若与当前入口不同，`read` 对应 `modes/<模式>.md`，**按那份文档执行**，不要硬套当前模式。
                3. 模式决定"怎么工作"，不决定"做什么领域的事"——领域能力按 `skills/ROUTING.md` 选。

                ## 常驻判据（存量项目）

                1. **先摸基线，再动手**：不读清结构就改 = 瞎改。用 `baseline-survey` 产出 `survey/{structure,baseline,hotspots,risks}.md`，你只读摘要。
                2. **能跑才算完成**：改完必须跑原有测试/构建，证据是命令与输出。
                3. **最小改动**：只改与目标相关的。不顺手重构、不调格式、不重命名无关变量。
                4. **先查调用方再改签名**：改签名/返回值/数据结构前先搜谁在用。
                5. **先复现再修**：修 bug 前先写能稳定复现的最小用例。
                6. **尊重既有约定**：项目的命名、分层、错误处理方式，跟着走。一致性优于局部最优。
                7. **一次一件事**：分开做、分次验证。

                ## 失败模式

                - 没读结构就改，改完发现还有三处同样地方没动。
                - 顺手重构无关代码，diff 三百行，review 无法判断。
                - 改了内部签名，没改调用方，运行时才炸。
                - 修了表面症状，根因还在（没先复现）。
                - 声称"修好了"但没跑原有测试，回归被破坏。

                ## 委派：强

                存量项目模块多、边界清楚，委派收益高：

                | 可以派 | 为什么 |
                |---|---|
                | 基线调研（`baseline-survey`） | 大量读文件，天然适合独立上下文 |
                | 独立模块改造 | 边界清楚、互不干扰 |
                | 多个独立 bug 排查 | 见 `dispatching-parallel-agents` |
                | 测试编写、回归验证 | 可独立验收 |
                | 按计划逐任务执行 | `subagent-driven-development` |

                **自己做**：架构级取舍、跨模块接口变更、风险区改动（`risks.md` 标红的）。

                ### 派发时必做

                1. 任务书**自包含**（输入路径、约束、期望格式都写清）
                2. 明确**领域 skill**（需要文献就写 `lit-search-strategy`，需要绘图就写 `sci-figure-kit`）
                3. 要求**三行证据**

                ### 预设选择

                - 要独立上下文、干净起点 → `spawn`（可指定 `agentPreset`）
                - 要继承主线决策 → `fork`（继承父预修订，**不能**另选预设）
                - 互不依赖的多个活 → 同一批并发派

                ## 通道纪律

                - 跨层只走：**文件路径 + 判决 + 证据指针**。
                - 子代理回三行：`改了什么` / `凭什么说对（命令与输出）` / `最不确定的一点`。
                - 你只查第三条。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
