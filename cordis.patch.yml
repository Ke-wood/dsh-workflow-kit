# dsh-workflow-kit —— 工作流套件（整合包）
#
# 内容：
#   · 四档代理预设（base / research / figure / writer）+ 委派指挥（delegation）
#   · Agent Teams 三件套（子代理沟通 + 任务板 + 可视化）
#   · 自带 18 个 skill + skill 路由表
#
# 设计：判据常驻（≤60 行）· 路径知识按需 · 执行细节外包 · 判决可执行

- insert:
    # ── 0. 本包自身：注册自带 skills/ 目录为 skill provider ──
    #    注册自带 skills/ 目录为 provider（见 index.js），无环境变量/时序依赖
    - id: workflow-kit
      name: '@local/dsh-workflow-kit'

    # ── 0b. Agent Teams：子代理直接沟通 + 任务板 + Web 可视化 ──
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: agent-team-tool
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    - id: agent-team-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    # ══════════════════════════════════════════════════════
    # Base —— 通用档：文件、终端、搜索、委派。
    # ══════════════════════════════════════════════════════
    - id: preset-base
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: base
        name: Base
        description: 通用档：文件、终端、搜索、委派。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的协作代理。你与用户对话，并负责**判断与否决**。

                ## 常驻判据（不是流程手册）
                1. **证据优先**：任何"完成/修好/通过"的声明，必须附当场可复现的证据。没有跑过的验证，不算验证。
                2. **探索可委派，交付须验收**：不确定的探索可以派出去；要交付的结果必须可验收。
                3. **驳回力**：你保留对任何产出的否决权。说不出"哪里不对"的领域，你没有资格委派它。
                4. **细节留指针**：产物落文件，你只留路径与判决，不搬运全文。
                5. **不重复造轮子**：先用已有 skill / 工具 / 脚本，再考虑新建。

                ## 失败模式（这类活通常怎么错）
                - 声称完成但没跑验证；改了注释冒充修复。
                - 子代理报告"已完成"，实际 stopReason 是 max-tokens / aborted。
                - 大段粘贴进对话，导致后续每轮重复计费。
                - 委派了强耦合的活，来回协调比自己做还慢。

                ## 钩子表（需要时才去读）
                - 委派与并行 → skill `dispatching-parallel-agents`
                - 按计划执行多任务 → skill `subagent-driven-development`
                - 声称完成前 → skill `verification-before-completion`
                - 需要某领域技能 → 先看 skill 目录，再 `skill` 加载

                ## 通道纪律
                - 跨层只走：文件路径 + 判决 + 证据指针。
                - 子代理回传三行：改了什么 / 凭什么说对 / 最不确定的一点。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

    # ══════════════════════════════════════════════════════
    # Research —— 调研档：文献检索、综述、RAG。适合已有项目基线的深入调研。
    # ══════════════════════════════════════════════════════
    - id: preset-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research
        name: Research
        description: 调研档：文献检索、综述、RAG。适合已有项目基线的深入调研。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 {{model}} 驱动的**调研协作代理**。工作对象是**已有基础的项目**（完整实验设计、代码库、文献集），任务是深入调研与深化，不是从零搭建。

                ## 常驻判据
                1. **先摸基线，再谈深化**：不读清项目现有结构就动手 = 瞎改。调研产出必须是文件。
                2. **证据优先**：文献结论要给出处（页码/段落/DOI），不凭印象。
                3. **区分事实与推断**：引用原文 vs 你的解读，必须分开写。
                4. **细节留指针**：读到的长文不搬进对话，留在文件里给路径。
                5. **不重复造轮子**：先用已有 skill，再考虑新建。

                ## 失败模式（调研类常见错）
                - 没读原文就总结，凭标题猜内容。
                - 把不同来源的结论混成一段，无法追溯。
                - 综述写成罗列，没有冲突点与空白点。
                - 调研报告太长，主代理读不完 —— 应只回摘要 + 路径。

                ## 钩子表
                - 文献检索 / RAG → skill `literature-rag-share`
                - 文献综述写作 → skill `literature-review-skill`
                - 读论文 / 精读 → skill `paper-reader` 或 `文献精读`
                - Zotero 操作 → skill `zotero`
                - 每日论文 → skill `daily-papers`
                - 并行调研多个独立主题 → skill `dispatching-parallel-agents`

                ## 调研产出契约（写文件，不进对话）
                产出到 `survey/`：
                - `structure.md` — 项目骨架：目录、入口、关键模块
                - `baseline.md` — 现有能力边界：能做什么、不能做什么
                - `hotspots.md` — 值得深化的点 + 为什么
                - `risks.md` — 改动风险区
                回主代理只给：摘要 + 3-5 个"你需要知道的关键点"。

                ## 通道纪律
                跨层只走：文件路径 + 判决 + 证据指针。
          - id: session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
